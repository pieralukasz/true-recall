name: Build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, pre-release, release]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run build
            # Unit tests, including schema-upgrade.test.ts: every released
            # database must still open. This job is the required "build"
            # check on main, pre-release and release, so a failure blocks
            # the merge.
            - run: bun run test

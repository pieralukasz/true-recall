name: Build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main, pre-release, release]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.12
            - run: bun install --frozen-lockfile --ignore-scripts
            - run: bun run build

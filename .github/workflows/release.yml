name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on release branch
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag_sha=$(git rev-list -n 1 "$tag")
          if ! git branch -r --contains "$tag_sha" | grep -q 'origin/release'; then
            echo "::error::Tag '$tag' is not on the 'release' branch."
            echo "Release flow: main -> PR -> pre-release -> PR -> release -> tag"
            exit 1
          fi
          echo "Tag '$tag' verified on release branch."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build plugin
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Extract release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk "/^## ${tag} /,/^## [0-9]/" CHANGELOG.md | sed '1d;$d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${tag}" > release-notes.md
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css sqlite3.wasm
